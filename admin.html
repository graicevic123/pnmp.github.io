<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNMP Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0D1B2A;--red:#C0392B;--amber:#D68910;--green:#1E8449;--teal:#148F77;--white:#fff;--muted:#8A9BB0;--border:rgba(255,255,255,0.08)}
body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--white);min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 80% 60% at 20% 10%,rgba(44,85,128,0.3) 0%,transparent 60%)}
.page{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 24px 80px}

/* PIN */
.pin-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center}
.pin-wrap h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(42px,7vw,72px);letter-spacing:0.03em;margin-bottom:6px}
.pin-wrap h1 em{color:var(--red);font-style:normal}
.pin-wrap p{font-size:14px;color:var(--muted);margin-bottom:28px}
.pin-box{background:rgba(255,255,255,0.04);border:0.5px solid var(--border);border-radius:14px;padding:28px;width:300px}
.pin-lbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.pin-inp{width:100%;padding:12px 16px;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.15);border-radius:8px;color:var(--white);font-family:'DM Mono',monospace;font-size:22px;letter-spacing:0.35em;text-align:center;outline:none;margin-bottom:12px}
.pin-btn{width:100%;padding:12px;background:var(--red);color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer}
.pin-btn:hover{background:#a93226}
.pin-err{font-size:13px;color:#F4A09A;margin-top:8px;display:none}

/* MAIN */
.main{display:none}

/* Sticky header */
.hdr{position:sticky;top:0;z-index:50;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:rgba(13,27,42,0.88);border-bottom:0.5px solid var(--border);padding:14px 0;margin-bottom:28px}
.hdr-inner{max-width:1100px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hdr h1{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:0.03em;line-height:1;flex-shrink:0}
.hdr h1 em{color:var(--red);font-style:normal}

/* Header right – STATIC layout, no jumping */
.hdr-right{display:flex;align-items:center;gap:8px}
/* Tabs group – fixed width container */
.tab-group{display:flex;gap:6px;flex-shrink:0}
/* Filter slot – fixed width so layout never shifts */
.filter-slot{width:180px;flex-shrink:0;position:relative}
.filter-slot select{position:absolute;top:0;left:0;width:100%;transition:opacity 0.15s}
.filter-slot select.hidden{opacity:0;pointer-events:none}
/* Action buttons */
.act-group{display:flex;gap:6px;flex-shrink:0}

.tab{width:86px;text-align:center;padding:7px 0;background:transparent;border:0.5px solid rgba(255,255,255,0.15);border-radius:7px;color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:all 0.15s}
.tab.on{background:var(--red);border-color:var(--red);color:#fff}
.tab:hover:not(.on){color:var(--white);border-color:rgba(255,255,255,0.3)}
.sel{width:100%;padding:7px 10px;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.15);border-radius:7px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;outline:none}
.sel option{background:#1B3A5C}
.act{padding:7px 14px;background:transparent;border:0.5px solid rgba(255,255,255,0.15);border-radius:7px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all 0.15s;white-space:nowrap}
.act:hover{color:var(--white);border-color:rgba(255,255,255,0.3)}

/* Stats */
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.stat{background:rgba(255,255,255,0.04);border:0.5px solid var(--border);border-radius:10px;padding:14px 18px;flex:1;min-width:110px;text-align:center}
.stat-n{font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1}
.stat-l{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:var(--muted);margin-top:4px}

/* Panels */
.panels{position:relative}
.panel{transition:opacity 0.2s}
.panel.off{opacity:0;pointer-events:none;position:absolute;top:0;left:0;width:100%}

/* Table */
.tbl-wrap{background:rgba(255,255,255,0.03);border:0.5px solid var(--border);border-radius:12px;overflow:hidden}
.tbl-hdr{padding:12px 18px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.tbl-lbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted)}
.loading{text-align:center;padding:48px;font-size:13px;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:0.1em}
.empty{text-align:center;padding:60px;color:var(--muted);font-size:14px}
table{width:100%;border-collapse:collapse}
th{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);padding:10px 16px;text-align:left;border-bottom:0.5px solid var(--border);background:rgba(255,255,255,0.02);white-space:nowrap}
td{padding:12px 16px;border-bottom:0.5px solid var(--border);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,0.025)}
.n{font-weight:500;color:var(--white)}
.sc{font-family:'Bebas Neue',sans-serif;font-size:20px}
.sc.hi{color:var(--green)}.sc.md{color:var(--amber)}.sc.lo{color:var(--red)}
.tm{font-size:12px;color:var(--muted);white-space:nowrap}
.dbtn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.1em;padding:4px 10px;border-radius:5px;background:rgba(255,255,255,0.06);border:0.5px solid var(--border);color:var(--muted);cursor:pointer;transition:all 0.15s;text-transform:uppercase;white-space:nowrap}
.dbtn:hover{color:var(--white);border-color:rgba(255,255,255,0.3)}
.stars{color:#FAC775;font-size:14px}

/* Drawer */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99;display:none}
.ovl.on{display:block}
.drw{position:fixed;right:0;top:0;height:100%;width:400px;max-width:95vw;background:#0D2035;border-left:0.5px solid var(--border);z-index:100;transform:translateX(100%);transition:transform 0.28s cubic-bezier(0.4,0,0.2,1);overflow-y:auto;padding:28px 22px}
.drw.on{transform:translateX(0)}
.drw-x{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:4px}
.drw-x:hover{color:var(--white)}
.drw-nm{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:0.03em;margin-bottom:3px}
.drw-mt{font-size:12px;color:var(--muted);margin-bottom:20px}
.drw-sc{font-family:'Bebas Neue',sans-serif;font-size:52px;line-height:1;margin-bottom:2px}
.drw-pct{font-size:13px;color:var(--muted);margin-bottom:24px}
.drw-q{margin-bottom:12px;padding:11px 13px;border-radius:8px;font-size:13px}
.drw-q.ok{background:rgba(30,132,73,0.12);border:0.5px solid rgba(30,132,73,0.25)}
.drw-q.nok{background:rgba(192,57,43,0.12);border:0.5px solid rgba(192,57,43,0.25)}
.drw-qt{font-weight:500;color:var(--white);margin-bottom:5px;line-height:1.4}
.drw-qa{font-size:12px;line-height:1.5}
.ok-t{color:#7FE8A8}.nok-t{color:#F4A09A}
.drw-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:16px}
</style>
</head>
<body>

<!-- PIN -->
<div class="pin-wrap" id="PIN">
 <h1>PNMP <em>ADMIN</em></h1>
 <p>Inštruktorska stran · vnesi PIN za dostop</p>
 <div class="pin-box">
  <div class="pin-lbl">PIN koda</div>
  <input class="pin-inp" type="password" id="pi" maxlength="6" placeholder="••••">
  <button class="pin-btn" onclick="checkPin()">Vstopi →</button>
  <div class="pin-err" id="pe">Napačen PIN.</div>
 </div>
</div>

<!-- HEADER -->
<div class="hdr" id="HDR" style="display:none">
 <div class="hdr-inner">
  <h1>PNMP <em>ADMIN</em></h1>
  <div class="hdr-right">
   <!-- Tabs – fixed width, ne skačejo -->
   <div class="tab-group">
    <button class="tab on" id="tK" onclick="tab('k')">Kvizi</button>
    <button class="tab" id="tA" onclick="tab('a')">Ankete</button>
    <button class="tab" id="tS" onclick="tab('s')">Simulator</button>
   </div>
   <!-- Filter slot – fixed width, oba selecta sta zložena drug čez drugega -->
   <div class="filter-slot">
    <select class="sel" id="fK" onchange="filtriraj()">
     <option value="">Vsi kvizi</option>
     <option value="prometna-nesreca">Prometna nesreča</option>
     <option value="mnozicne-nesrece">Množične nesreče</option>
    </select>
    <select class="sel hidden" id="fA" onchange="filtrirajAnkete()">
     <option value="">Vse ankete</option>
     <option value="Prometna nesreča">Prometna nesreča</option>
     <option value="Množične nesreče">Množične nesreče</option>
    </select>
    <select class="sel hidden" id="fS" onchange="filtrirajSim()">
     <option value="">Vsi simulatorji</option>
     <option value="simulator">Triažni (množične)</option>
     <option value="simulator_pn">Prometna nesreča</option>
    </select>
   </div>
   <div class="act-group">
    <button class="act" onclick="reload()">↻</button>
    <button class="act" style="color:#F4A09A;border-color:rgba(192,57,43,0.4)" onclick="pocistiVse()">🗑 Počisti</button>
    <button class="act" onclick="location.href='index.html'">← Portal</button>
   </div>
  </div>
 </div>
</div>

<!-- MAIN -->
<div class="main" id="MAIN">
 <div class="page">

  <div class="stats">
   <div class="stat"><div class="stat-n" id="sN">—</div><div class="stat-l" id="lN">Skupaj rešitev</div></div>
   <div class="stat"><div class="stat-n" id="sU">—</div><div class="stat-l" id="lU">Tečajnikov</div></div>
   <div class="stat"><div class="stat-n" id="sP">—</div><div class="stat-l" id="lP">Povp. rezultat</div></div>
   <div class="stat"><div class="stat-n" id="sO">—</div><div class="stat-l" id="lO">Odličnih (≥87%)</div></div>
  </div>

  <div class="panels" id="PANELS">

   <!-- KVIZI -->
   <div class="panel" id="pK">
    <div class="tbl-wrap">
     <div class="tbl-hdr">
      <span class="tbl-lbl">Rezultati tečajnikov</span>
      <span class="tbl-lbl" id="cntK">—</span>
     </div>
     <div id="tblK"><div class="loading">Nalagam...</div></div>
    </div>
   </div>

   <!-- ANKETE -->
   <div class="panel off" id="pA">
    <div class="tbl-wrap">
     <div class="tbl-hdr">
      <span class="tbl-lbl">Ankete tečajnikov</span>
      <span class="tbl-lbl" id="cntA">—</span>
     </div>
     <div id="tblA"><div class="loading">Nalagam...</div></div>
    </div>
   </div>

   <!-- SIMULATOR -->
   <div class="panel off" id="pS">
    <div class="tbl-wrap">
     <div class="tbl-hdr">
      <span class="tbl-lbl">Triažni simulator – rezultati</span>
      <span class="tbl-lbl" id="cntS">—</span>
     </div>
     <div id="tblS"><div class="loading">Nalagam...</div></div>
    </div>
   </div>

  </div>
 </div>
</div>

<!-- Drawer overlay -->
<div class="ovl" id="OVL" onclick="closeDrawer()"></div>
<div class="drw" id="DRW">
 <button class="drw-x" onclick="closeDrawer()">✕</button>
 <div id="DRW_C"></div>
</div>

<script>
firebase.initializeApp({apiKey:"AIzaSyCXrItf0MFjLP0FiMqZSX-cAqcnvk4nPwA",authDomain:"pnmp-kviz.firebaseapp.com",projectId:"pnmp-kviz",storageBucket:"pnmp-kviz.firebasestorage.app",messagingSenderId:"907229581116",appId:"1:907229581116:web:831cad9f6749bfb1015839"});
const db=firebase.firestore();
const PIN='1234';
let kvizi=[],filtrirani=[],ankete=[],ankFiltrirane=[],simulatorji=[],simFiltrirani=[];
let anketeOk=false,simulatorOk=false,curTab='k';

/* PIN */
function checkPin(){
 if(document.getElementById('pi').value===PIN){
  document.getElementById('PIN').style.display='none';
  document.getElementById('HDR').style.display='block';
  document.getElementById('MAIN').style.display='block';
  reload();
 }else{
  document.getElementById('pe').style.display='block';
  document.getElementById('pi').value='';
  document.getElementById('pi').focus();
 }
}
document.addEventListener('DOMContentLoaded',()=>{
 document.getElementById('pi').addEventListener('keydown',e=>{if(e.key==='Enter')checkPin();});
});

/* TABS */
function tab(t){
 curTab=t;
 ['k','a','s'].forEach(x=>{
  document.getElementById('t'+x.toUpperCase()).classList.toggle('on',t===x);
  document.getElementById('p'+x.toUpperCase()).classList.toggle('off',t!==x);
 });
 document.getElementById('fK').classList.toggle('hidden',t!=='k');
 document.getElementById('fA').classList.toggle('hidden',t!=='a');
 document.getElementById('fS').classList.toggle('hidden',t!=='s');
 syncH();
 if(t==='k') statsKvizi();
 if(t==='a'){ if(!anketeOk) loadAnkete(); else{ statsAnkete(); renderAnkete(ankFiltrirane); } }
 if(t==='s'){ if(!simulatorOk) loadSimulator(); else{ statsSimulator(); renderSimulator(simFiltrirani); } }
}

/* Sync panel height */
function syncH(){
 const active=document.getElementById(curTab==='k'?'pK':curTab==='a'?'pA':'pS');
 document.getElementById('PANELS').style.height=active.scrollHeight+'px';
}

/* Helpers */
function set(nId,nVal,lId,lVal){
 document.getElementById(nId).textContent=nVal;
 if(lId) document.getElementById(lId).textContent=lVal;
}
function fCas(ts){
 if(!ts?.seconds) return '—';
 const d=new Date(ts.seconds*1000);
 return d.toLocaleDateString('sl-SI',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('sl-SI',{hour:'2-digit',minute:'2-digit'});
}

/* ── KVIZI ── */
async function loadKvizi(){
 document.getElementById('tblK').innerHTML='<div class="loading">Nalagam...</div>';
 try{
  const s=await db.collection('rezultati').orderBy('cas','desc').limit(500).get();
  kvizi=[];
  s.forEach(d=>{const x=d.data();x._id=d.id;kvizi.push(x);});
  filtrirani=[...kvizi];
  statsKvizi();renderKvizi();
 }catch(e){ document.getElementById('tblK').innerHTML='<div class="loading">Napaka pri nalaganju.</div>'; }
}
function filtriraj(){
 const f=document.getElementById('fK').value;
 filtrirani=f?kvizi.filter(r=>r.kviz===f||r.kvizNaziv===f):kvizi;
 statsKvizi();renderKvizi();
}
function statsKvizi(){
 const n=filtrirani.length;
 const u=new Set(filtrirani.map(r=>r.polnoIme)).size;
 const p=n>0?Math.round(filtrirani.reduce((a,r)=>a+(r.procent||0),0)/n):0;
 const o=filtrirani.filter(r=>(r.procent||0)>=87).length;
 set('sN',n,'lN','Skupaj rešitev');
 set('sU',u,'lU','Tečajnikov');
 set('sP',p+'%','lP','Povp. rezultat');
 set('sO',o,'lO','Odličnih (≥87%)');
 document.getElementById('cntK').textContent=n+' zapisov';
}
function renderKvizi(){
 const el=document.getElementById('tblK');
 if(!filtrirani.length){el.innerHTML='<div class="empty">Ni rezultatov za prikaz.</div>';syncH();return;}
 let h='<table><thead><tr><th>Ime in priimek</th><th>Kviz</th><th>Rezultat</th><th>Čas</th><th>Pregled</th></tr></thead><tbody>';
 filtrirani.forEach(r=>{
  const pct=r.procent||0,cls=pct>=87?'hi':pct>=62?'md':'lo';
  const kv=r.kvizNaziv||r.kviz||'—';
  const col=kv.includes('prometna')||kv.includes('Prometna')?'#F4A09A':'#7FE8A8';
  h+=`<tr>
   <td class="n">${r.polnoIme||'—'}</td>
   <td style="font-size:11px;font-weight:600;color:${col}">${kv}</td>
   <td><span class="sc ${cls}">${r.tocke||0}/${r.skupaj||8}</span> <span style="font-size:11px;color:var(--muted)">${pct}%</span></td>
   <td class="tm">${fCas(r.cas)}</td>
   <td><button class="dbtn" onclick="openDrawer('${r._id}')">Pregled</button></td>
  </tr>`;
 });
 h+='</tbody></table>';
 el.innerHTML=h;
 document.getElementById('cntK').textContent=filtrirani.length+' zapisov';
 syncH();
}

/* ── ANKETE ── */
async function loadAnkete(){
 document.getElementById('tblA').innerHTML='<div class="loading">Nalagam...</div>';
 try{
  const s=await db.collection('ankete').orderBy('cas','desc').limit(200).get();
  ankete=[];s.forEach(d=>ankete.push(d.data()));
  ankFiltrirane=[...ankete];
  anketeOk=true;statsAnkete();renderAnkete(ankFiltrirane);
 }catch(e){ document.getElementById('tblA').innerHTML='<div class="loading">Napaka pri nalaganju anket.</div>'; }
}
function filtrirajAnkete(){
 const f=document.getElementById('fA').value;
 ankFiltrirane=f?ankete.filter(r=>r.kviz===f):ankete;
 renderAnkete(ankFiltrirane);
}
function statsAnkete(){
 const data=ankFiltrirane.length?ankFiltrirane:ankete;
 const n=data.length;
 const u=new Set(data.map(r=>r.polnoIme)).size;
 const p=n>0?Math.round(data.reduce((a,r)=>a+(r.ocena||0),0)/n*10)/10:0;
 const o=data.filter(a=>a.izboljsaj&&a.izboljsaj!=='—').length;
 set('sN',n,'lN','Skupaj anket');
 set('sU',u,'lU','Tečajnikov');
 set('sP',p+' ★','lP','Povp. ocena');
 set('sO',o,'lO','S komentarji');
 document.getElementById('cntA').textContent=n+' zapisov';
}
function renderAnkete(data){
 data=data||ankete;
 const el=document.getElementById('tblA');
 if(!data.length){el.innerHTML='<div class="empty">Ni anket za prikaz.</div>';syncH();return;}
 let h='<table><thead><tr><th>Ime in priimek</th><th>Tema</th><th>Ocena</th><th>Čas</th><th>Pregled</th></tr></thead><tbody>';
 data.forEach((r,i)=>{
  const stars='★'.repeat(r.ocena||0)+'☆'.repeat(5-(r.ocena||0));
  h+=`<tr>
   <td class="n">${r.polnoIme||'—'}</td>
   <td style="font-size:11px;color:var(--muted)">${r.kviz||'—'}</td>
   <td><span class="stars">${stars}</span></td>
   <td class="tm">${fCas(r.cas)}</td>
   <td><button class="dbtn" onclick="openAnketaDrawer(${ankete.indexOf(r)})">Pregled</button></td>
  </tr>`;
 });
 h+='</tbody></table>';
 el.innerHTML=h;
 document.getElementById('cntA').textContent=data.length+' zapisov';
 syncH();
}

/* ── SIMULATOR ── */
async function loadSimulator(){
 document.getElementById('tblS').innerHTML='<div class="loading">Nalagam...</div>';
 try{
  simulatorji=[];
  const [s1,s2]=await Promise.all([
   db.collection('simulator').orderBy('cas','desc').limit(200).get(),
   db.collection('simulator_pn').orderBy('cas','desc').limit(200).get()
  ]);
  s1.forEach(d=>{const x=d.data();x._id=d.id;x._tip='simulator';x._tipLabel='Triažni (množične)';x._tipColor='#148F77';simulatorji.push(x);});
  s2.forEach(d=>{const x=d.data();x._id=d.id;x._tip='simulator_pn';x._tipLabel='Prometna nesreča';x._tipColor='#C17D0A';simulatorji.push(x);});
  simulatorji.sort((a,b)=>(b.cas?.seconds||0)-(a.cas?.seconds||0));
  simFiltrirani=[...simulatorji];
  simulatorOk=true;
  statsSimulator();renderSimulator(simFiltrirani);
 }catch(e){ document.getElementById('tblS').innerHTML='<div class="loading">Napaka: '+e.message+'</div>'; }
}
function filtrirajSim(){
 const f=document.getElementById('fS').value;
 simFiltrirani=f?simulatorji.filter(r=>r._tip===f):simulatorji;
 renderSimulator(simFiltrirani);
}
function statsSimulator(){
 const n=simulatorji.length;
 const u=new Set(simulatorji.map(r=>r.polnoIme)).size;
 const p=n>0?Math.round(simulatorji.reduce((a,r)=>a+(r.procent||0),0)/n):0;
 const o=simulatorji.filter(r=>(r.procent||0)>=90).length;
 set('sN',n,'lN','Skupaj rešitev');
 set('sU',u,'lU','Tečajnikov');
 set('sP',p+'%','lP','Povp. rezultat');
 set('sO',o,'lO','Odličnih (≥90%)');
 document.getElementById('cntS').textContent=simulatorji.length+' zapisov';
}
function renderSimulator(data){
 const el=document.getElementById('tblS');
 if(!data||!data.length){el.innerHTML='<div class="empty">Ni rezultatov za prikaz.</div>';syncH();return;}
 let h='<table><thead><tr><th>Ime in priimek</th><th>Simulator</th><th>Rezultat</th><th>Čas</th><th>Pregled</th></tr></thead><tbody>';
 data.forEach(r=>{
  const pct=r.procent||0,cls=pct>=90?'hi':pct>=60?'md':'lo';
  h+=`<tr>
   <td class="n">${r.polnoIme||'—'}</td>
   <td style="font-size:11px;font-weight:600;color:${r._tipColor}">${r._tipLabel}</td>
   <td><span class="sc ${cls}">${r.pravilno||0}/${r.skupaj||10}</span> <span style="font-size:11px;color:var(--muted)">${pct}%</span></td>
   <td class="tm">${fCas(r.cas)}</td>
   <td><button class="dbtn" onclick="openSimDrawer('${r._id}')">Pregled</button></td>
  </tr>`;
 });
 h+='</tbody></table>';
 el.innerHTML=h;
 syncH();
}

/* ── DRAWER – kvizi ── */
function openDrawer(id){
 const r=kvizi.find(x=>x._id===id);
 if(!r)return;
 const pct=r.procent||0,col=pct>=87?'var(--green)':pct>=62?'var(--amber)':'var(--red)';
 let h=`<div class="drw-nm">${r.polnoIme||'—'}</div>
  <div class="drw-mt">${r.kvizNaziv||r.kviz||'—'} · ${fCas(r.cas)}</div>
  <div class="drw-sc" style="color:${col}">${r.tocke||0}/${r.skupaj||8}</div>
  <div class="drw-pct">${pct}% pravilnih</div>`;
 if(r.odgovori){
  Object.keys(r.odgovori).sort((a,b)=>+a.slice(1)-+b.slice(1)).forEach(k=>{
   const o=r.odgovori[k];
   h+=`<div class="drw-q ${o.pravilno?'ok':'nok'}">
    <div class="drw-qt">${k.replace('v','')}. ${o.vprasanje||''}</div>
    <div class="drw-qa">Izbral: <span class="${o.pravilno?'ok-t':'nok-t'}">${o.izbran||'—'}</span>${!o.pravilno?'<br>Pravilno: <span class="ok-t">'+(o.pravilen||'—')+'</span>':''}</div>
   </div>`;
  });
 }
 document.getElementById('DRW_C').innerHTML=h;
 document.getElementById('DRW').classList.add('on');
 document.getElementById('OVL').classList.add('on');
}

/* ── DRAWER – ankete ── */
function openAnketaDrawer(idx){
 const r=ankete[idx];
 if(!r)return;
 const stars='★'.repeat(r.ocena||0)+'☆'.repeat(5-(r.ocena||0));
 const col=(r.ocena||0)>=4?'var(--green)':(r.ocena||0)>=3?'var(--amber)':'var(--red)';
 let h=`<div class="drw-nm">${r.polnoIme||'—'}</div>
  <div class="drw-mt">${r.kviz||'—'} · ${fCas(r.cas)}</div>
  <div class="drw-sc" style="color:${col}">${stars}</div>
  <div class="drw-pct">${r.tezavnost||'—'} težavnost</div>`;
 const polja=[
  {label:'Kaj ti je bilo všeč',val:r.vsec},
  {label:'Kaj bi izboljšal',val:r.izboljsaj},
  {label:'Tema za naslednjič',val:r.naslednjic},
 ];
 polja.forEach(p=>{
  if(p.val&&p.val!=='—'){
   h+=`<div class="drw-q ok">
    <div class="drw-qt">${p.label}</div>
    <div class="drw-qa" style="color:var(--white)">${p.val}</div>
   </div>`;
  }
 });
 document.getElementById('DRW_C').innerHTML=h;
 document.getElementById('DRW').classList.add('on');
 document.getElementById('OVL').classList.add('on');
}

/* ── DRAWER – simulator ── */
function openSimDrawer(id){
 const r=simulatorji.find(x=>x._id===id);
 if(!r)return;
 const pct=r.procent||0,col=pct>=90?'var(--green)':pct>=60?'var(--amber)':'var(--red)';
 let h=`<div class="drw-nm">${r.polnoIme||'—'}</div>
  <div class="drw-mt">${r._tipLabel||'—'} · ${fCas(r.cas)}</div>
  <div class="drw-badge" style="background:${r._tipColor}22;color:${r._tipColor};border:0.5px solid ${r._tipColor}44">${r._tipLabel}</div>
  <div class="drw-sc" style="color:${col}">${r.pravilno||0}/${r.skupaj||10}</div>
  <div class="drw-pct">${pct}% pravilnih · ${r.napacno||0} napačnih</div>`;

 if(r.odgovori&&Object.keys(r.odgovori).length){
  Object.keys(r.odgovori).sort((a,b)=>parseInt(a.slice(1))-parseInt(b.slice(1))).forEach(k=>{
   const o=r.odgovori[k];
   h+=`<div class="drw-q ${o.pravilno?'ok':'nok'}">
    <div class="drw-qt">${o.st}. ${o.scenario}</div>
    <div class="drw-qa">
     Izbral: <span class="${o.pravilno?'ok-t':'nok-t'}">${o.izbran}</span>
     ${!o.pravilno?'<br>Pravilno: <span class="ok-t">'+o.pravilen+'</span>':''}
    </div>
   </div>`;
  });
 } else {
  h+=`<div style="font-size:13px;color:var(--muted);margin-top:16px;padding:12px;background:rgba(255,255,255,0.04);border-radius:8px">Podrobni odgovori so na voljo za nove rešitve simulatorja.</div>`;
 }

 document.getElementById('DRW_C').innerHTML=h;
 document.getElementById('DRW').classList.add('on');
 document.getElementById('OVL').classList.add('on');
}

function closeDrawer(){
 document.getElementById('DRW').classList.remove('on');
 document.getElementById('OVL').classList.remove('on');
}

/* ── POČISTI VSE ── */
async function pocistiVse(){
 const colMap={k:['rezultati'],a:['ankete'],s:['simulator','simulator_pn']};
 const colNames={k:'kvize',a:'ankete',s:'rezultate simulatorja'};
 const cols=colMap[curTab];
 const ime=colNames[curTab];
 if(!confirm(`Izbriši VSE ${ime}?\n\nTega ni mogoče razveljaviti!`))return;
 let n=0;
 try{
  for(const col of cols){
   const snap=await db.collection(col).get();
   const batch=db.batch();
   snap.docs.forEach(d=>{batch.delete(d.ref);n++;});
   await batch.commit();
  }
  alert(`Izbrisano ${n} zapisov.`);
  kvizi=[];filtrirani=[];ankete=[];ankFiltrirane=[];simulatorji=[];simFiltrirani=[];
  anketeOk=false;simulatorOk=false;
  reload();
 }catch(e){
  alert('Napaka: '+e.message);
 }
}
async function reload(){
 await loadKvizi();
 anketeOk=false;simulatorOk=false;
 if(curTab==='a') loadAnkete();
 if(curTab==='s') loadSimulator();
}
</script>
